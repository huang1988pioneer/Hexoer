<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: https: http: file: blob:; media-src data: https: http: file: blob:;"/>
  <title>Hexoer WYSIWYG</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0d1218;
      color: #e6edf3;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    }
    #editor {
      box-sizing: border-box;
      min-height: 100%;
      padding: 28px 36px 96px;
      max-width: 860px;
      margin: 0 auto;
      outline: none;
      font-size: 16.5px;
      line-height: 1.7;
      caret-color: #7cdaf9;
    }
    #editor::after {
      content: "";
      display: table;
      clear: both;
    }
    #editor.is-empty::before {
      content: attr(data-placeholder);
      color: #6b7785;
      font-style: italic;
      pointer-events: none;
      float: left;
      height: 0;
    }
    h1, h2, h3, h4, h5, h6 {
      color: #7cdaf9;
      margin: 1.25em 0 0.45em;
      font-weight: 650;
      line-height: 1.3;
    }
    h1 { font-size: 2em; border-bottom: 1px solid #2a3648; padding-bottom: 0.2em; }
    h2 { font-size: 1.55em; border-bottom: 1px solid #243041; padding-bottom: 0.15em; }
    h3 { font-size: 1.28em; }
    p { margin: 0.7em 0; }
    a { color: #5ec8f0; text-decoration: none; }
    a:hover { text-decoration: underline; }
    code {
      font-family: Consolas, "Cascadia Mono", monospace;
      background: #1a2330;
      padding: 0.12em 0.38em;
      border-radius: 4px;
      font-size: 0.92em;
    }
    pre {
      background: #121a24;
      border: 1px solid #2a3648;
      border-radius: 8px;
      padding: 12px 14px;
      overflow: auto;
      white-space: pre-wrap;
    }
    pre code { background: transparent; padding: 0; }
    blockquote {
      margin: 1em 0;
      padding: 0.35em 1em;
      border-left: 4px solid #0e7490;
      background: #151c26;
      color: #c5d0dc;
    }
    table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    th, td { border: 1px solid #2a3648; padding: 8px 10px; min-width: 4em; }
    th { background: #1a2330; }
    img { max-width: 100%; height: auto; border-radius: 6px; cursor: pointer; }
    img.hugoer-img-selected { outline: 2px solid #7cdaf9; outline-offset: 3px; cursor: grab; }
    img.hugoer-img-moving { opacity: 0.38; cursor: grabbing; }
    audio, video { width: 100%; max-width: 640px; margin: 1em 0; display: block; }
    #imgChrome {
      position: fixed;
      display: none;
      z-index: 18;
      box-sizing: content-box;
      border: 2px solid #7cdaf9;
      border-radius: 8px;
      pointer-events: none;
    }
    #imgChrome.open { display: block; }
    #imgChrome.moving { opacity: 0; }
    #imgMoveHit {
      position: absolute;
      inset: 0;
      pointer-events: auto;
      cursor: grab;
    }
    #imgDrop {
      position: fixed;
      display: none;
      height: 3px;
      background: #7cdaf9;
      border-radius: 99px;
      box-shadow: 0 0 0 1px rgba(13, 18, 24, 0.35);
      z-index: 19;
      pointer-events: none;
    }
    #imgDrop.open { display: block; }
    #imgToolbar {
      position: absolute;
      left: 0;
      bottom: calc(100% + 8px);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 6px;
      background: #151c26;
      border: 1px solid #2a3648;
      border-radius: 10px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.38);
      pointer-events: auto;
      white-space: nowrap;
      z-index: 3;
    }
    #imgChrome.toolbar-below #imgToolbar {
      bottom: auto;
      top: calc(100% + 8px);
    }
    #imgChrome.toolbar-end #imgToolbar {
      left: auto;
      right: 0;
    }
    #imgToolbar button {
      background: #1c2736;
      color: #d7e0ea;
      border: 0;
      border-radius: 7px;
      padding: 6px 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      line-height: 1;
    }
    #imgToolbar button:hover { background: #243140; }
    #imgToolbar button.on { background: #0e7490; color: #fff; }
    #imgToolbar .sep {
      width: 1px;
      height: 16px;
      background: #2a3648;
      margin: 0 2px;
    }
    #imgSize {
      color: #9aa8b8;
      font-size: 11px;
      padding: 0 6px 0 4px;
      min-width: 3.5em;
    }
    .img-handle {
      position: absolute;
      width: 11px;
      height: 11px;
      background: #7cdaf9;
      border: 2px solid #0d1218;
      border-radius: 3px;
      pointer-events: auto;
      box-sizing: border-box;
      touch-action: none;
      z-index: 2;
    }
    .img-handle.nw { left: -7px; top: -7px; cursor: nwse-resize; }
    .img-handle.ne { right: -7px; top: -7px; cursor: nesw-resize; }
    .img-handle.sw { left: -7px; bottom: -7px; cursor: nesw-resize; }
    .img-handle.se { right: -7px; bottom: -7px; cursor: nwse-resize; }
    hr { border: none; border-top: 1px solid #2a3648; margin: 1.5em 0; }
    ul, ol { padding-left: 1.45em; }
    li { margin: 0.2em 0; }
    li > input[type="checkbox"] { margin-right: 0.45em; }
    strong { color: #fff; }
    #mask {
      display: none;
      position: fixed; inset: 0;
      background: rgba(7, 10, 14, 0.55);
      align-items: center; justify-content: center;
      z-index: 20;
    }
    #mask.open { display: flex; }
    #dialog {
      width: min(420px, calc(100% - 32px));
      background: #151c26;
      border: 1px solid #2a3648;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    }
    #dialog h2 { margin: 0 0 12px; font-size: 15px; color: #7cdaf9; border: 0; }
    #dialog label { display: block; font-size: 12px; color: #9aa8b8; margin: 8px 0 4px; }
    #dialog input {
      width: 100%; box-sizing: border-box;
      background: #0d1218; color: #e6edf3;
      border: 1px solid #2a3648; border-radius: 8px;
      padding: 8px 10px; font-size: 14px;
    }
    #dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    #dialog button {
      background: #1c2736; color: #d7e0ea; border: 0;
      border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 600;
    }
    #dialog button.primary { background: #0e7490; color: #fff; }
  </style>
</head>
<body>
  <div id="editor" contenteditable="true" spellcheck="true" data-placeholder="開始撰寫文章…"></div>
  <div id="imgChrome">
    <div id="imgToolbar">
      <button type="button" data-move="-1" title="上移">上</button>
      <button type="button" data-move="1" title="下移">下</button>
      <span class="sep"></span>
      <button type="button" data-align="left" title="靠左">左</button>
      <button type="button" data-align="center" title="置中">中</button>
      <button type="button" data-align="right" title="靠右">右</button>
      <span class="sep"></span>
      <button type="button" data-align="wrap-left" title="文字從右側環繞">繞左</button>
      <button type="button" data-align="wrap-right" title="文字從左側環繞">繞右</button>
      <span class="sep"></span>
      <button type="button" id="imgReset" title="恢復原始大小與預設排版">原始</button>
      <span id="imgSize"></span>
    </div>
    <div id="imgMoveHit" title="拖曳移動位置"></div>
    <span class="img-handle nw" data-handle="nw"></span>
    <span class="img-handle ne" data-handle="ne"></span>
    <span class="img-handle sw" data-handle="sw"></span>
    <span class="img-handle se" data-handle="se"></span>
  </div>
  <div id="imgDrop"></div>
  <div id="mask">
    <div id="dialog">
      <h2 id="dlgTitle">插入連結</h2>
      <label id="dlgTextLabel" for="dlgText">顯示文字</label>
      <input id="dlgText" type="text"/>
      <label id="dlgHrefLabel" for="dlgHref">網址</label>
      <input id="dlgHref" type="text"/>
      <div class="actions">
        <button type="button" id="dlgCancel">取消</button>
        <button type="button" class="primary" id="dlgOk">確定</button>
      </div>
    </div>
  </div>
  <script>
    const editor = document.getElementById('editor');
    const mask = document.getElementById('mask');
    let suppress = false;
    let changeTimer = 0;
    let dialogKind = 'link';
    let savedRange = null;
    const mediaMap = Object.create(null);

    function lookupMedia(src) {
      if (!src) return null;
      if (mediaMap[src]) return mediaMap[src];
      try {
        const decoded = decodeURI(src);
        if (decoded !== src && mediaMap[decoded]) return mediaMap[decoded];
      } catch {}
      return null;
    }

    function applyMedia(root) {
      const scope = root || editor;
      scope.querySelectorAll('img[src], audio[src], video[src], source[src]').forEach((el) => {
        const src = el.getAttribute('src');
        if (!src || /^(data:|blob:|https?:|file:)/i.test(src)) return;
        const mapped = lookupMedia(src);
        if (!mapped) return;
        if (!el.getAttribute('data-hugoer-src'))
          el.setAttribute('data-hugoer-src', src);
        el.setAttribute('src', mapped);
      });
      scope.querySelectorAll('img[data-hugoer-align]').forEach((img) => {
        applyImageAlign(img, img.getAttribute('data-hugoer-align'));
      });
      if (selectedImg) layoutImageChrome();
    }

    function mergeMedia(media) {
      if (!media) return;
      Object.assign(mediaMap, media);
    }

    function snapshotHtml() {
      const selected = [];
      editor.querySelectorAll('.hugoer-img-selected').forEach((el) => {
        el.classList.remove('hugoer-img-selected');
        selected.push(el);
      });
      const nodes = editor.querySelectorAll('[data-hugoer-src]');
      const restored = [];
      nodes.forEach((el) => {
        restored.push([el, el.getAttribute('src')]);
        el.setAttribute('src', el.getAttribute('data-hugoer-src'));
      });
      const html = editor.innerHTML;
      restored.forEach(([el, src]) => {
        if (src) el.setAttribute('src', src);
      });
      selected.forEach((el) => el.classList.add('hugoer-img-selected'));
      return html;
    }

    const imgChrome = document.getElementById('imgChrome');
    const imgSizeLabel = document.getElementById('imgSize');
    const imgDrop = document.getElementById('imgDrop');
    let selectedImg = null;
    let resizeState = null;
    let moveState = null;

    function editorMaxImageWidth() {
      const style = window.getComputedStyle(editor);
      const pad = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      return Math.max(120, Math.floor(editor.clientWidth - pad));
    }

    function currentImageWidth(img) {
      const attr = parseInt(img.getAttribute('width') || '', 10);
      if (attr > 0) return attr;
      const styled = parseInt(img.style.width || '', 10);
      if (styled > 0) return styled;
      return Math.round(img.getBoundingClientRect().width);
    }

    function applyImageWidth(img, width) {
      const max = editorMaxImageWidth();
      const next = Math.max(64, Math.min(max, Math.round(width)));
      img.style.maxWidth = '100%';
      img.style.height = 'auto';
      img.style.width = next + 'px';
      img.setAttribute('width', String(next));
      return next;
    }

    function applyImageAlign(img, align) {
      if (!align) {
        img.removeAttribute('data-hugoer-align');
        img.style.display = '';
        img.style.cssFloat = '';
        img.style.margin = '';
        return;
      }
      img.setAttribute('data-hugoer-align', align);
      img.style.maxWidth = '100%';
      img.style.height = 'auto';
      img.style.display = 'block';
      if (align === 'wrap-left') {
        img.style.cssFloat = 'left';
        img.style.margin = '0.25em 1em 0.8em 0';
      } else if (align === 'wrap-right') {
        img.style.cssFloat = 'right';
        img.style.margin = '0.25em 0 0.8em 1em';
      } else {
        img.style.cssFloat = 'none';
        if (align === 'center') img.style.margin = '0.5em auto';
        else if (align === 'right') img.style.margin = '0.5em 0 0.5em auto';
        else img.style.margin = '0.5em auto 0.5em 0';
      }
    }

    function layoutImageChrome() {
      if (!selectedImg || !selectedImg.isConnected) {
        clearImageSelection();
        return;
      }
      const rect = selectedImg.getBoundingClientRect();
      if (rect.width < 2 || rect.height < 2) {
        imgChrome.classList.remove('open');
        return;
      }
      imgChrome.style.left = (rect.left - 2) + 'px';
      imgChrome.style.top = (rect.top - 2) + 'px';
      imgChrome.style.width = rect.width + 'px';
      imgChrome.style.height = rect.height + 'px';
      imgChrome.classList.toggle('toolbar-below', rect.top < 52);
      imgChrome.classList.toggle('toolbar-end', rect.left + 280 > window.innerWidth);
      imgChrome.classList.add('open');
      imgSizeLabel.textContent = Math.round(rect.width) + ' px';
      const align = selectedImg.getAttribute('data-hugoer-align') || '';
      imgChrome.querySelectorAll('#imgToolbar [data-align]').forEach((btn) => {
        btn.classList.toggle('on', btn.getAttribute('data-align') === align);
      });
    }

    function selectImage(img) {
      const sel = window.getSelection();
      if (sel) sel.removeAllRanges();
      if (selectedImg && selectedImg !== img)
        selectedImg.classList.remove('hugoer-img-selected');
      selectedImg = img;
      img.classList.add('hugoer-img-selected');
      if (!img.complete)
        img.addEventListener('load', layoutImageChrome, { once: true });
      layoutImageChrome();
    }

    function clearImageSelection() {
      if (selectedImg) {
        selectedImg.classList.remove('hugoer-img-selected');
        selectedImg.classList.remove('hugoer-img-moving');
      }
      selectedImg = null;
      resizeState = null;
      moveState = null;
      imgChrome.classList.remove('open', 'moving');
      imgDrop.classList.remove('open');
    }

    function isImageOnlyBlock(node, img) {
      if (!node || node === editor) return false;
      return [...node.childNodes].every((child) =>
        child === img
        || child.nodeName === 'BR'
        || (child.nodeType === 3 && !String(child.textContent || '').trim()));
    }

    function ensureImageBlock(img) {
      const parent = img.parentElement;
      if (!parent) return img;
      if (parent === editor) {
        const wrap = document.createElement('p');
        editor.insertBefore(wrap, img);
        wrap.appendChild(img);
        return wrap;
      }
      if (isImageOnlyBlock(parent, img))
        return parent;
      const wrap = document.createElement('p');
      parent.insertBefore(wrap, img);
      wrap.appendChild(img);
      return wrap;
    }

    function dropSiblingAt(x, y, unit) {
      const scope = unit.parentElement || editor;
      const stack = document.elementsFromPoint(x, y);
      for (const el of stack) {
        if (el === imgDrop || (el.closest && el.closest('#imgChrome')))
          continue;
        if (el === unit || unit.contains(el))
          continue;
        let cur = el;
        while (cur && cur.parentElement !== scope)
          cur = cur.parentElement;
        if (cur && cur.parentElement === scope && cur !== unit)
          return cur;
      }
      return null;
    }

    function dropBeforeTarget(target, y) {
      if (!target) return false;
      const rect = target.getBoundingClientRect();
      return y < rect.top + rect.height / 2;
    }

    function showDropMarker(unit, target, before) {
      const editorRect = editor.getBoundingClientRect();
      let top;
      let left;
      let width;
      if (target) {
        const rect = target.getBoundingClientRect();
        top = (before ? rect.top : rect.bottom) - 1;
        left = rect.left;
        width = rect.width;
      } else {
        const last = [...(unit.parentElement || editor).children].filter((el) => el !== unit).pop();
        const rect = last ? last.getBoundingClientRect() : editorRect;
        top = last ? rect.bottom : editorRect.top + 24;
        left = last ? rect.left : editorRect.left + 36;
        width = last ? rect.width : Math.max(80, editorRect.width - 72);
      }
      imgDrop.style.top = top + 'px';
      imgDrop.style.left = left + 'px';
      imgDrop.style.width = Math.max(24, width) + 'px';
      imgDrop.classList.add('open');
    }

    function moveImageBy(dir) {
      if (!selectedImg) return;
      const unit = ensureImageBlock(selectedImg);
      const parent = unit.parentElement;
      if (!parent) return;
      if (dir < 0) {
        const prev = unit.previousElementSibling;
        if (!prev) return;
        parent.insertBefore(unit, prev);
      } else {
        const next = unit.nextElementSibling;
        if (!next) return;
        parent.insertBefore(unit, next.nextSibling);
      }
      selectedImg.scrollIntoView({ block: 'nearest' });
      layoutImageChrome();
      notifyChange();
    }

    function startImageMove(event) {
      if (!selectedImg || resizeState) return;
      moveState = {
        startX: event.clientX,
        startY: event.clientY,
        active: false,
        hovered: false
      };
      try { event.currentTarget.setPointerCapture(event.pointerId); } catch {}
    }

    function onImageMoveMove(event) {
      if (!moveState || !selectedImg) return;
      const dx = event.clientX - moveState.startX;
      const dy = event.clientY - moveState.startY;
      if (!moveState.active) {
        if (dx * dx + dy * dy < 36) return;
        moveState.active = true;
        selectedImg.classList.add('hugoer-img-moving');
        imgChrome.classList.add('moving');
      }
      event.preventDefault();
      const unit = ensureImageBlock(selectedImg);
      const target = dropSiblingAt(event.clientX, event.clientY, unit);
      const before = dropBeforeTarget(target, event.clientY);
      if (target || event.clientY > unit.getBoundingClientRect().bottom + 8
          || event.clientY < unit.getBoundingClientRect().top - 8) {
        moveState.hovered = true;
        moveState.target = target;
        moveState.before = before;
        showDropMarker(unit, target, before);
      }
    }

    function endImageMove() {
      if (!moveState) return;
      const active = moveState.active;
      const hovered = moveState.hovered;
      const target = moveState.target;
      const before = moveState.before;
      moveState = null;
      imgDrop.classList.remove('open');
      imgChrome.classList.remove('moving');
      if (selectedImg)
        selectedImg.classList.remove('hugoer-img-moving');
      if (!active || !hovered || !selectedImg) {
        layoutImageChrome();
        return;
      }
      const unit = ensureImageBlock(selectedImg);
      const parent = unit.parentElement;
      if (!parent) return;
      if (!target)
        parent.appendChild(unit);
      else if (before)
        parent.insertBefore(unit, target);
      else
        parent.insertBefore(unit, target.nextSibling);
      selectedImg.scrollIntoView({ block: 'nearest' });
      layoutImageChrome();
      notifyChange();
    }

    function startImageResize(event, handle) {
      if (!selectedImg) return;
      event.preventDefault();
      event.stopPropagation();
      const rect = selectedImg.getBoundingClientRect();
      resizeState = {
        handle: handle,
        startX: event.clientX,
        startWidth: rect.width
      };
      try { event.currentTarget.setPointerCapture(event.pointerId); } catch {}
    }

    function onImageResizeMove(event) {
      if (!resizeState || !selectedImg) return;
      event.preventDefault();
      const dx = event.clientX - resizeState.startX;
      const sign = (resizeState.handle === 'nw' || resizeState.handle === 'sw') ? -1 : 1;
      applyImageWidth(selectedImg, resizeState.startWidth + dx * sign);
      layoutImageChrome();
    }

    function endImageResize() {
      if (!resizeState) return;
      resizeState = null;
      notifyChange();
    }

    document.getElementById('imgToolbar').addEventListener('mousedown', (event) => {
      event.preventDefault();
    });
    document.getElementById('imgToolbar').addEventListener('click', (event) => {
      const btn = event.target.closest('button');
      if (!btn || !selectedImg) return;
      if (btn.id === 'imgReset') {
        selectedImg.removeAttribute('width');
        selectedImg.style.width = '';
        applyImageAlign(selectedImg, null);
      } else if (btn.hasAttribute('data-move')) {
        moveImageBy(parseInt(btn.getAttribute('data-move'), 10) || 0);
        return;
      } else if (btn.hasAttribute('data-align')) {
        const align = btn.getAttribute('data-align');
        const current = selectedImg.getAttribute('data-hugoer-align');
        applyImageAlign(selectedImg, current === align ? null : align);
      }
      layoutImageChrome();
      notifyChange();
    });
    imgChrome.querySelectorAll('.img-handle').forEach((handle) => {
      handle.addEventListener('pointerdown', (event) => startImageResize(event, handle.getAttribute('data-handle')));
      handle.addEventListener('pointermove', onImageResizeMove);
      handle.addEventListener('pointerup', endImageResize);
      handle.addEventListener('pointercancel', endImageResize);
    });
    document.getElementById('imgMoveHit').addEventListener('pointerdown', (event) => {
      startImageMove(event);
      event.preventDefault();
      event.stopPropagation();
    });
    window.addEventListener('pointermove', (event) => {
      if (resizeState) onImageResizeMove(event);
      else if (moveState) onImageMoveMove(event);
    });
    window.addEventListener('pointerup', (event) => {
      if (resizeState) endImageResize();
      else if (moveState) endImageMove(event);
    });
    window.addEventListener('pointercancel', () => {
      if (resizeState) endImageResize();
      else if (moveState) endImageMove();
    });
    window.addEventListener('scroll', layoutImageChrome, true);
    window.addEventListener('resize', layoutImageChrome);

    document.execCommand('defaultParagraphSeparator', false, 'p');

    function post(payload) {
      if (typeof invokeCSharpAction === 'function') {
        invokeCSharpAction(JSON.stringify(payload));
      }
    }

    function isEmpty() {
      const text = (editor.innerText || '').replace(/\u200B/g, '').trim();
      return text.length === 0;
    }

    function updatePlaceholder() {
      editor.classList.toggle('is-empty', isEmpty());
    }

    function currentBlock() {
      const sel = window.getSelection();
      if (!sel.rangeCount) return null;
      let node = sel.anchorNode;
      if (node && node.nodeType === 3) node = node.parentElement;
      while (node && node !== editor) {
        const tag = node.tagName;
        if (tag && /^(P|DIV|H1|H2|H3|H4|H5|H6|LI|BLOCKQUOTE|PRE)$/.test(tag))
          return node;
        node = node.parentElement;
      }
      return editor;
    }

    function textBeforeCaret(block) {
      const sel = window.getSelection();
      if (!sel.rangeCount || !block) return '';
      const range = sel.getRangeAt(0);
      const pre = document.createRange();
      try {
        pre.selectNodeContents(block);
        pre.setEnd(range.startContainer, range.startOffset);
        return pre.toString();
      } catch {
        return '';
      }
    }

    function clearPrefix(block, count) {
      const sel = window.getSelection();
      if (!sel.rangeCount || !block || count <= 0) return;
      const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
      let remaining = count;
      const parts = [];
      while (remaining > 0) {
        const node = walker.nextNode();
        if (!node) break;
        const take = Math.min(node.length, remaining);
        parts.push([node, take]);
        remaining -= take;
      }
      for (let i = parts.length - 1; i >= 0; i--) {
        const [node, take] = parts[i];
        node.deleteData(0, take);
      }
    }

    function notifyChange() {
      updatePlaceholder();
      if (suppress) return;
      clearTimeout(changeTimer);
      changeTimer = setTimeout(() => {
        post({ type: 'change', html: snapshotHtml() });
      }, 140);
    }

    function insertHtml(html) {
      editor.focus();
      document.execCommand('insertHTML', false, html);
      applyMedia();
      if (/<img\b/i.test(html || '')) {
        const imgs = editor.querySelectorAll('img');
        if (imgs.length) selectImage(imgs[imgs.length - 1]);
      }
      notifyChange();
    }

    function wrapInline(tag, fallback) {
      const sel = window.getSelection();
      const text = sel && sel.toString();
      if (text) {
        document.execCommand('insertHTML', false, '<' + tag + '>' + escapeHtml(text) + '</' + tag + '>');
      } else {
        insertHtml('<' + tag + '>' + fallback + '</' + tag + '>');
      }
      notifyChange();
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function toggleHeading(level) {
      const block = currentBlock();
      const tag = 'h' + level;
      if (block && block.tagName && block.tagName.toLowerCase() === tag) {
        document.execCommand('formatBlock', false, 'p');
      } else {
        document.execCommand('formatBlock', false, tag);
      }
      notifyChange();
    }

    function toggleInlineCode() {
      const sel = window.getSelection();
      if (!sel.rangeCount) return;
      let node = sel.anchorNode;
      if (node && node.nodeType === 3) node = node.parentElement;
      if (node && node.closest && node.closest('code') && !node.closest('pre')) {
        const code = node.closest('code');
        const text = document.createTextNode(code.textContent);
        code.replaceWith(text);
        notifyChange();
        return;
      }
      wrapInline('code', '程式碼');
    }

    function insertCodeBlock() {
      insertHtml('<pre><code class="language-text">程式碼</code></pre><p><br></p>');
    }

    function insertTaskList() {
      insertHtml('<ul><li><input type="checkbox"> 待辦項目</li></ul><p><br></p>');
    }

    function insertTable() {
      insertHtml('<table><thead><tr><th>欄位一</th><th>欄位二</th></tr></thead><tbody><tr><td>內容</td><td>內容</td></tr></tbody></table><p><br></p>');
    }

    function saveSelection() {
      const sel = window.getSelection();
      savedRange = sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
    }

    function restoreSelection() {
      if (!savedRange) return;
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedRange);
    }

    function openDialog(kind) {
      dialogKind = kind;
      saveSelection();
      const selected = window.getSelection() ? window.getSelection().toString() : '';
      document.getElementById('dlgTitle').textContent = kind === 'image' ? '插入圖片' : '插入連結';
      document.getElementById('dlgTextLabel').textContent = kind === 'image' ? '替代文字' : '顯示文字';
      document.getElementById('dlgHrefLabel').textContent = kind === 'image' ? '圖片路徑或網址' : '網址';
      document.getElementById('dlgText').value = selected || (kind === 'image' ? '圖片說明' : '連結文字');
      document.getElementById('dlgHref').value = kind === 'image' ? 'image.jpg' : 'https://';
      mask.classList.add('open');
      setTimeout(() => document.getElementById('dlgHref').focus(), 20);
    }

    function closeDialog() {
      mask.classList.remove('open');
      editor.focus();
      restoreSelection();
    }

    document.getElementById('dlgCancel').addEventListener('click', closeDialog);
    document.getElementById('dlgOk').addEventListener('click', () => {
      const text = document.getElementById('dlgText').value || '';
      const href = document.getElementById('dlgHref').value || '';
      closeDialog();
      if (dialogKind === 'image') {
        insertHtml('<img src="' + escapeHtml(href) + '" alt="' + escapeHtml(text) + '"/>');
      } else {
        insertHtml('<a href="' + escapeHtml(href) + '">' + escapeHtml(text) + '</a>');
      }
    });
    mask.addEventListener('click', (event) => {
      if (event.target === mask) closeDialog();
    });

    function handleMarkdownShortcut(event) {
      if (event.key !== ' ') return false;
      const block = currentBlock();
      if (!block || block.tagName === 'PRE') return false;
      const before = textBeforeCaret(block);
      const heading = /^(#{1,6})$/.exec(before);
      if (heading) {
        event.preventDefault();
        clearPrefix(block, heading[1].length);
        document.execCommand('formatBlock', false, 'h' + heading[1].length);
        notifyChange();
        return true;
      }
      if (before === '>' ) {
        event.preventDefault();
        clearPrefix(block, 1);
        document.execCommand('formatBlock', false, 'blockquote');
        notifyChange();
        return true;
      }
      if (before === '-' || before === '*') {
        event.preventDefault();
        clearPrefix(block, 1);
        document.execCommand('insertUnorderedList');
        notifyChange();
        return true;
      }
      if (/^\d+\.$/.test(before)) {
        event.preventDefault();
        clearPrefix(block, before.length);
        document.execCommand('insertOrderedList');
        notifyChange();
        return true;
      }
      if (before === '---' || before === '***') {
        event.preventDefault();
        clearPrefix(block, before.length);
        document.execCommand('insertHorizontalRule');
        notifyChange();
        return true;
      }
      if (before === '```' || before === '``') {
        event.preventDefault();
        clearPrefix(block, before.length);
        insertCodeBlock();
        return true;
      }
      return false;
    }

    editor.addEventListener('input', notifyChange);
    editor.addEventListener('keyup', updatePlaceholder);
    editor.addEventListener('blur', () => {
      clearTimeout(changeTimer);
      if (!suppress) post({ type: 'change', html: snapshotHtml() });
      updatePlaceholder();
    });
    editor.addEventListener('keydown', (event) => {
      if (event.ctrlKey || event.metaKey) {
        const key = event.key.toLowerCase();
        if (key === 'b') { event.preventDefault(); document.execCommand('bold'); notifyChange(); return; }
        if (key === 'i') { event.preventDefault(); document.execCommand('italic'); notifyChange(); return; }
        if (key === 'k') { event.preventDefault(); openDialog('link'); return; }
        if (key === 's') { event.preventDefault(); post({ type: 'save', html: snapshotHtml() }); return; }
        if (event.shiftKey && key === 'm') { event.preventDefault(); post({ type: 'toggleMode', html: snapshotHtml() }); return; }
      }
      if (handleMarkdownShortcut(event)) return;
      if (event.key === 'Tab') {
        const block = currentBlock();
        if (block && block.tagName === 'LI') {
          event.preventDefault();
          document.execCommand(event.shiftKey ? 'outdent' : 'indent');
          notifyChange();
        }
      }
      if (event.key === 'Enter' && currentBlock() && currentBlock().tagName === 'PRE') {
        event.preventDefault();
        document.execCommand('insertText', false, '\n');
        notifyChange();
      }
    });

    editor.addEventListener('paste', (event) => {
      event.preventDefault();
      const html = event.clipboardData.getData('text/html');
      const text = event.clipboardData.getData('text/plain');
      if (html && !/class=["']?Mso|xmlns:o=|office:office/i.test(html)) {
        const template = document.createElement('template');
        template.innerHTML = html;
        template.content.querySelectorAll('script,iframe,object,embed,style').forEach((el) => el.remove());
        template.content.querySelectorAll('*').forEach((el) => {
          [...el.attributes].forEach((attr) => {
            if (attr.name.startsWith('on') || (attr.name === 'href' && /^\s*javascript:/i.test(attr.value)))
              el.removeAttribute(attr.name);
          });
        });
        document.execCommand('insertHTML', false, template.innerHTML);
      } else {
        document.execCommand('insertText', false, text);
      }
      notifyChange();
    });

    editor.addEventListener('click', (event) => {
      if (event.target && event.target.matches && event.target.matches('input[type="checkbox"]')) {
        notifyChange();
      }
    });
    editor.addEventListener('pointerdown', (event) => {
      const img = event.target && event.target.closest ? event.target.closest('img') : null;
      if (img && editor.contains(img)) {
        selectImage(img);
        startImageMove(event);
        event.preventDefault();
      }
    });
    editor.addEventListener('dragstart', (event) => {
      if (event.target && event.target.tagName === 'IMG')
        event.preventDefault();
    });
    document.addEventListener('mousedown', (event) => {
      if (event.target.closest('#imgChrome') || event.target.closest('#mask'))
        return;
      if (event.target.closest('#editor') && event.target.closest('img'))
        return;
      clearImageSelection();
    });
    document.addEventListener('keydown', (event) => {
      if (!selectedImg) return;
      if (mask.classList.contains('open')) return;
      const tag = event.target && event.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (event.key === 'Escape') {
        clearImageSelection();
        return;
      }
      if (event.key === 'ArrowUp') {
        event.preventDefault();
        moveImageBy(-1);
        return;
      }
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        moveImageBy(1);
        return;
      }
      if (event.key === 'Delete' || event.key === 'Backspace') {
        event.preventDefault();
        const next = selectedImg;
        clearImageSelection();
        next.remove();
        notifyChange();
      }
    });

    window.hugoerSetHtml = function (html, media) {
      mergeMedia(media);
      suppress = true;
      clearImageSelection();
      editor.innerHTML = html || '';
      applyMedia();
      updatePlaceholder();
      suppress = false;
    };

    window.hugoerAddMedia = function (media) {
      mergeMedia(media);
      applyMedia();
    };

    window.hugoerFocus = function () {
      editor.focus();
    };

    window.hugoerFlush = function () {
      post({ type: 'flush', html: snapshotHtml() });
    };

    window.hugoerCommand = function (name, argument) {
      editor.focus();
      switch (name) {
        case 'undo': document.execCommand('undo'); break;
        case 'redo': document.execCommand('redo'); break;
        case 'bold': document.execCommand('bold'); break;
        case 'italic': document.execCommand('italic'); break;
        case 'strike': document.execCommand('strikeThrough'); break;
        case 'heading': toggleHeading(parseInt(argument || '2', 10)); return;
        case 'inlineCode': toggleInlineCode(); return;
        case 'codeBlock': insertCodeBlock(); return;
        case 'link': openDialog('link'); return;
        case 'image': openDialog('image'); return;
        case 'quote': document.execCommand('formatBlock', false, 'blockquote'); break;
        case 'bulletList': document.execCommand('insertUnorderedList'); break;
        case 'orderedList': document.execCommand('insertOrderedList'); break;
        case 'taskList': insertTaskList(); return;
        case 'table': insertTable(); return;
        case 'hr': document.execCommand('insertHorizontalRule'); break;
        case 'addMedia':
          if (argument) {
            try { mergeMedia(JSON.parse(argument)); } catch {}
            applyMedia();
          }
          return;
        case 'insertHtml':
          if (argument) insertHtml(argument);
          return;
        default: return;
      }
      notifyChange();
    };

    updatePlaceholder();
    post({ type: 'ready' });
  </script>
</body>
</html>
